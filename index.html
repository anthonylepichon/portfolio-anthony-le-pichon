<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Portfolio d'Anthony Le Pichon, développeur web full stack.">
    <title>Anthony Le Pichon | Développeur web full stack</title>
</head>

<body>
    <!-- Ce lien apparaît au clavier et permet d'éviter toute la navigation principale. -->
    <a class="skip-link" href="#main-content">Aller au contenu principal</a>

    <!--
        Le header est écrit dans chaque page pour rester présent même sans JavaScript.
        Ses styles et le comportement du menu mobile restent dans des fichiers communs.
    -->
    <header class="site-header">
        <div class="site-header__inner">
            <a
                class="site-header__brand"
                href="index.html"
                aria-label="Accueil du portfolio d'Anthony Le Pichon"
            >
                <img
                    class="site-header__logo"
                    src="assets/images/logos/logo.svg"
                    alt=""
                >
                <span>Anthony <span class="site-header__surname">LE PICHON</span></span>
            </a>

            <!-- Ce bouton est visible uniquement sur tablette et mobile. -->
            <button
                class="site-header__menu-button"
                type="button"
                aria-label="Ouvrir le menu"
                aria-controls="site-navigation"
                aria-expanded="false"
            >
                <span class="site-header__menu-line"></span>
                <span class="site-header__menu-line"></span>
                <span class="site-header__menu-line"></span>
            </button>

            <nav id="site-navigation" class="site-navigation" aria-label="Navigation principale">
                <ul class="site-navigation__list">
                    <li><a class="site-navigation__link" href="index.html" aria-current="page">Accueil</a></li>
                    <li><a class="site-navigation__link" href="pages/a-propos.html">À propos</a></li>
                    <li><a class="site-navigation__link" href="pages/competences.html">Compétences</a></li>
                    <li><a class="site-navigation__link" href="pages/projets.html">Projets</a></li>
                    <li><a class="site-navigation__link" href="pages/contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!--
        La balise main contient le contenu principal et unique de cette page.
        Chaque section possède un identifiant utilisé par les liens de navigation.
    -->
    <main id="main-content" tabindex="-1">
        <section id="accueil">
            <p>Bonjour, je suis</p>
            <h1>Anthony Le Pichon</h1>
            <p>Développeur web junior</p>

            <a href="#projets">Découvrir mes projets</a>
            <a href="#contact">Me contacter</a>
        </section>

        <section id="a-propos">
            <h2>À propos</h2>
        </section>

        <section id="competences">
            <h2>Mes compétences</h2>
        </section>

        <section id="projets">
            <h2>Mes projets</h2>
        </section>

        <section id="contact">
            <h2>Me contacter</h2>
        </section>
    </main>

    <!-- Le pied de page accueillera les informations secondaires et légales. -->
    <footer>
        <p>Portfolio d'Anthony Le Pichon</p>
    </footer>

    <!-- Le script est placé à la fin pour que le HTML soit chargé avant son exécution. -->
    <script src="js/header.js"></script>
</body>
</html>
