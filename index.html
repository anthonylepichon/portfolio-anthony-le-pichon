<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ces fichiers affichent le logo ALP dans l'onglet et sur les appareils mobiles. -->
    <link rel="icon" href="assets/images/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/images/favicon/site.webmanifest">
    <meta name="theme-color" content="#078FA7">

    <!--
        La description résume le contenu de la page pour les moteurs de recherche.
        Elle pourra être précisée lorsque les textes définitifs du portfolio seront rédigés.
    -->
    <meta
        name="description"
        content="Portfolio d'Anthony Le Pichon, développeur web junior."
    >

    <title>Anthony Le Pichon | Développeur web junior</title>
</head>

<body>
    <!-- L'en-tête regroupe l'identité du site et sa navigation principale. -->
    <header>
        <a href="#accueil" aria-label="Retour à l'accueil">ALP</a>

        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="#a-propos">À propos</a></li>
                <li><a href="#competences">Compétences</a></li>
                <li><a href="#projets">Projets</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!--
        La balise main contient le contenu principal et unique de cette page.
        Chaque section possède un identifiant utilisé par les liens de navigation.
    -->
    <main>
        <section id="accueil">
            <p>Bonjour, je suis</p>
            <h1>Anthony Le Pichon</h1>
            <p>Développeur web junior</p>

            <a href="#projets">Découvrir mes projets</a>
            <a href="#contact">Me contacter</a>
        </section>

        <section id="a-propos">
            <h2>À propos</h2>
        </section>

        <section id="competences">
            <h2>Mes compétences</h2>
        </section>

        <section id="projets">
            <h2>Mes projets</h2>
        </section>

        <section id="contact">
            <h2>Me contacter</h2>
        </section>
    </main>

    <!-- Le pied de page accueillera les informations secondaires et légales. -->
    <footer>
        <p>Portfolio d'Anthony Le Pichon</p>
    </footer>
</body>
</html>
